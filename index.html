<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membandingkan Tata Tulis Aksara Jawa</title>
    <style>
        /* Memuat font dari root folder yang sama */
        @font-face {
            font-family: 'Ngayogyann';
            src: url('ngayogyann.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Ngayogyan';
            src: url('ngayogyan.ttf') format('truetype');
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px;
            background: #f4f4f9;
            color: #333;
        }
        h1 { text-align: center; margin-bottom: 30px; }

        /* Panel Kontrol Slider */
        .controls {
            display: flex; gap: 30px; justify-content: center; flex-wrap: wrap;
            margin-bottom: 25px;
            background: #fff; padding: 15px 30px; border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .control-group { 
            display: flex; align-items: center; gap: 10px; font-weight: 600;
        }

        /* Gradasi Latar Belakang (Dibuat pastel agar aksara hitam tetap terbaca jelas) */
        .grad-blue { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); }
        .grad-red { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
        .grad-green { background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); }
        .grad-grey { background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%); }

        /* Styling Panel */
        .panel {
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; flex-direction: column;
        }
        .panel h2 { margin-top: 0; font-size: 1.2rem; text-align: center; color: #222; }
        
        /* Area Input Latin */
        textarea#textInput {
            width: 100%;
            min-height: 120px;
            border: none; background: rgba(255, 255, 255, 0.4);
            border-radius: 8px; padding: 10px;
            font-size: 1.1rem; resize: vertical;
            outline: none; font-family: inherit; color: #000;
        }
        textarea#textInput:focus { background: rgba(255, 255, 255, 0.7); }
        
        /* Container Output 3 Tata Tulis */
        .output-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; margin-top: 25px;
        }
        
        .output-box {
            flex-grow: 1; min-height: 150px;
            word-wrap: break-word; white-space: pre-wrap;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px; padding: 15px;
            color: #000;
        }

        /* Deklarasi Font Spesifik */
        .font-kbj { font-family: 'Ngayogyann', sans-serif; }
        .font-sriwedari { font-family: 'Ngayogyann', sans-serif; }
        .font-carakawi { font-family: 'Ngayogyan', sans-serif; }
    </style>
</head>
<body>
    <h1>Aplikasi Membandingkan Tata Tulis Aksara Jawa</h1>
    
    <!-- 1. Master Kontrol Slider -->
    <div class="controls">
        <div class="control-group">
            <label>Ukuran Aksara:</label>
            <input type="range" id="fontSizeRange" min="20" max="70" value="30">
            <span id="fontSizeVal">30</span>px
        </div>
        <div class="control-group">
            <label>Spasi Vertikal:</label>
            <input type="range" id="lineHeightRange" min="1" max="3" step="0.1" value="1.5">
            <span id="lineHeightVal">1.5</span>
        </div>
    </div>

    <!-- 2. Kotak Input Latin -->
    <div class="panel grad-blue">
        <h2>Input Huruf Latin</h2>
        <!-- ID textInput diikat langsung oleh carakawi.js. Kapital otomatis dinonaktifkan -->
        <textarea id="textInput" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Ketik kalimat Latin di sini..."></textarea>
    </div>

    <!-- 3. Kotak Hasil Transliterasi -->
    <div class="output-container">
        <!-- Hasil KBJ -->
        <div class="panel grad-red">
            <h2>Paugeran KBJ</h2>
            <div id="kbjOutput" class="output-box font-kbj" style="font-size:30px; line-height:1.5;"></div>
        </div>
        
        <!-- Hasil Sriwedari -->
        <div class="panel grad-green">
            <h2>Paugeran Sriwedari</h2>
            <div id="sriwedariOutput" class="output-box font-sriwedari" style="font-size:30px; line-height:1.5;"></div>
        </div>
        
        <!-- Hasil Cara Kawi -->
        <div class="panel grad-grey">
            <h2>Cara Kawi (Mardi Kawi)</h2>
            <!-- ID previewOutput diikat langsung oleh carakawi.js untuk menampilkan hasilnya -->
            <div id="previewOutput" class="output-box font-carakawi" style="font-size:30px; line-height:1.5;"></div>
        </div>
    </div>

    <!-- Elemen tersembunyi (Dummy) yang dipanggil oleh carakawi.js agar tidak error -->
    <div style="display:none;">
        <select id="fontSelect"></select>
        <span id="charCount"></span>
        <button id="copyBtn"></button>
        <button id="clearBtn"></button>
    </div>

    <!-- Logika Integrasi KBJ, Sriwedari, dan Slider -->
    <script>
        // A. Menyinkronkan slider manual ke panel KBJ & Sriwedari.
        // (Panel Cara Kawi otomatis disesuaikan oleh internal carakawi.js sendiri)
        document.getElementById('fontSizeRange').addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            document.getElementById('kbjOutput').style.fontSize = size;
            document.getElementById('sriwedariOutput').style.fontSize = size;
        });

        document.getElementById('lineHeightRange').addEventListener('input', (e) => {
            const height = e.target.value;
            document.getElementById('kbjOutput').style.lineHeight = height;
            document.getElementById('sriwedariOutput').style.lineHeight = height;
        });

        // B. Mengisolasi & memuat kbj.js dan sriwedari.js melalui Fetch
        let transKbj = null;
        let transSriwedari = null;

        async function initTransliteration() {
            try {
                // Memanggil file skrip di direktori root GitHub Pages
                const [kbjRes, sriRes] = await Promise.all([
                    fetch('kbj.js'),
                    fetch('sriwedari.js')
                ]);
                
                const kbjText = await kbjRes.text();
                const sriText = await sriRes.text();

                // Membungkus skrip dalam Function Sandbox agar konstanta global tidak saling menimpa
                transKbj = new Function('teks', kbjText + '\nreturn transliterasiKalimat(teks);');
                transSriwedari = new Function('teks', sriText + '\nreturn transliterasiKalimat(teks);');

                // Jika saat reload ada teks tersisa, translasikan segera
                updateKbjSriwedari();
            } catch (err) {
                console.error("Gagal memuat file transliterasi:", err);
                document.getElementById('kbjOutput').innerText = "Gagal memuat kbj.js";
                document.getElementById('sriwedariOutput').innerText = "Gagal memuat sriwedari.js";
            }
        }

        // C. Fungsi untuk merender ke kotak KBJ dan Sriwedari secara simultan
        function updateKbjSriwedari() {
            const teks = document.getElementById('textInput').value;
            if (transKbj) {
                document.getElementById('kbjOutput').innerText = transKbj(teks);
            }
            if (transSriwedari) {
                document.getElementById('sriwedariOutput').innerText = transSriwedari(teks);
            }
        }

        // Jalankan transliterasi KBJ dan Sriwedari setiap kali pengguna mengetik
        document.getElementById('textInput').addEventListener('input', updateKbjSriwedari);

        // Mulai pemuatan isolasi saat halaman dibuka
        initTransliteration();
    </script>
    
    <!-- Memuat carakawi.js (Akan langsung berjalan dan mengenali ID pada HTML ini) -->
    <script src="carakawi.js"></script>
</body>
</html>
